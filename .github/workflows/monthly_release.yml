name: Monthly release

on:
  schedule:
    - cron: "0 9 2 * *"  # every second day of the month at 1:00am PST (9:00am UTC)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autoupdate:
    name: Autoupdate
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set current date
        run: |
          echo "DATE=$(date +'%y.%m')" >> $GITHUB_ENV
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Checkout branch
        run: |
          git checkout monthly_release || git checkout -b monthly_release
      - name: Update dependencies
        run: |
          python Tools/Release/update_dependencies.py --release
      - name: Commit changes
        run: |
          git add -u
          git commit -m "Update dependencies.json"
      - name: Push changes
        run: |
          git push -f origin monthly_release
      - name: Open pull request
        run: |
          if gh pr view monthly_release --json number >/dev/null 2>&1; then
            gh pr edit monthly_release \
              --body "Automated via .github/workflows/monthly_release.yml." \
              --title "Release: WarpX ${{ env.DATE }}"
          else
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --body "Automated via .github/workflows/monthly_release.yml." \
              --title "Release: WarpX ${{ env.DATE }}"
          fi
